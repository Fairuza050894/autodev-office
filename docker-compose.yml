name: autodev
x-app-env: &app-env
  NODE_ENV: development
  DATABASE_URL: postgresql://autodev:${POSTGRES_PASSWORD:-autodev-local-db}@postgres:5432/autodev
  REDIS_URL: redis://redis:6379
  SESSION_SECRET: ${SESSION_SECRET:-local-only-change-this-secret-before-production-2026}
  SETTINGS_KEY: ${SETTINGS_KEY:-}
  PUBLIC_URL: ${PUBLIC_URL:-http://localhost:4000}
  PUBLIC_BASE_URL: ${PUBLIC_URL:-http://localhost:4000}
  DASHBOARD_URL: ${DASHBOARD_URL:-http://localhost:3000}
  PUBLIC_LIVE_URL: ${PUBLIC_LIVE_URL:-http://127.0.0.1:4400}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@autodev.local}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-AutoDevLocal2026!}
  LLM_MODE: ${LLM_MODE:-mock}
  LLM_PROVIDER: ${LLM_PROVIDER:-openai}
  DEPLOY_TARGET: ${DEPLOY_TARGET:-docker-local}
  LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  RUNNER_URL: http://runner:4100
  RUNNER_TOKEN: ${RUNNER_TOKEN:-local-only-runner-token-change-before-production-2026}
  WORKSPACE_ROOT: /workspaces
  ARTIFACT_ROOT: /workspaces
  SMTP_HOST: ${SMTP_HOST:-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  EMAIL_FROM: ${EMAIL_FROM:-AutoDev Office <office@autodev.local>}
  EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  GITEA_URL: http://gitea:3000
  GITEA_TOKEN: ${GITEA_TOKEN:-}
  GITEA_USER: ${GITEA_USER:-autodev}
  GITEA_TOKEN_FILE: /integration/gitea-token
  S3_ENDPOINT: http://minio:9000
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-autodev}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-autodev-local-storage}
  S3_BUCKET: autodev-artifacts
  S3_REGION: us-east-1
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: autodev
      POSTGRES_USER: autodev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autodev-local-db}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U autodev -d autodev]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  minio:
    image: autodev-minio:local
    build: {context: ., dockerfile: infra/Dockerfile.minio}
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-autodev}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-autodev-local-storage}
    volumes: [minio-data:/data]
    ports: ['127.0.0.1:9000:9000', '127.0.0.1:9001:9001']
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://localhost:9000/minio/health/live").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  minio-init:
    image: node:22-bookworm-slim
    command: [node, /bootstrap/minio-init.mjs]
    volumes: ['./infra/minio-init.mjs:/bootstrap/minio-init.mjs:ro']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-autodev}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-autodev-local-storage}
    depends_on:
      minio: {condition: service_healthy}
  mailpit:
    image: axllent/mailpit:v1.24
    ports: ['127.0.0.1:8025:8025']
    restart: unless-stopped
  gitea:
    image: gitea/gitea:1.23.7
    environment:
      GITEA__database__DB_TYPE: sqlite3
      GITEA__security__INSTALL_LOCK: 'true'
      GITEA__service__DISABLE_REGISTRATION: 'true'
      GITEA__server__ROOT_URL: http://localhost:3001/
      GITEA__server__SSH_DOMAIN: localhost
      GITEA__server__SSH_PORT: '2222'
    volumes: [gitea-data:/data]
    ports: ['127.0.0.1:3001:3000', '127.0.0.1:2222:22']
    healthcheck:
      test: [CMD-SHELL, wget -q -O /dev/null http://localhost:3000/api/healthz]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  gitea-init:
    image: gitea/gitea:1.23.7
    user: root
    entrypoint: [/bin/sh, /bootstrap/gitea-init.sh]
    environment:
      GITEA_USER: ${GITEA_USER:-autodev}
      GITEA_PASSWORD: ${GITEA_PASSWORD:-AutoDevGitLocal2026!}
    volumes: [gitea-data:/data, integration:/integration, './scripts/gitea-init.sh:/bootstrap/gitea-init.sh:ro']
    depends_on:
      gitea: {condition: service_healthy}
  sandbox-image:
    image: autodev-sandbox:local
    build: {context: ., dockerfile: infra/Dockerfile.sandbox}
    entrypoint: [node, -e, 'console.log("Sandbox image ready")']
  runner:
    build: {context: ., dockerfile: infra/Dockerfile.runner}
    environment:
      RUNNER_TOKEN: ${RUNNER_TOKEN:-local-only-runner-token-change-before-production-2026}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:4000}
      PUBLIC_LIVE_URL: ${PUBLIC_LIVE_URL:-http://127.0.0.1:4400}
      WORKSPACE_ROOT: /workspaces
      WORKSPACE_VOLUME: autodev-workspaces
      SANDBOX_IMAGE: autodev-sandbox:local
      GITEA_URL: http://gitea:3000
      GITEA_USER: ${GITEA_USER:-autodev}
      GITEA_TOKEN_FILE: /integration/gitea-token
      COOLIFY_URL: ${COOLIFY_URL:-}
      COOLIFY_TOKEN: ${COOLIFY_TOKEN:-}
      COOLIFY_APP_UUID: ${COOLIFY_APP_UUID:-}
      COOLIFY_PUBLIC_URL: ${COOLIFY_PUBLIC_URL:-}
      UAT_PROXY_URL: ${UAT_PROXY_URL:-}
      UAT_EGRESS_NETWORK: ${UAT_EGRESS_NETWORK:-}
    volumes: [/var/run/docker.sock:/var/run/docker.sock, workspaces:/workspaces, runner-state:/state, integration:/integration:ro]
    depends_on:
      sandbox-image: {condition: service_completed_successfully}
      gitea-init: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://localhost:4100/health",{headers:{authorization:"Bearer "+process.env.RUNNER_TOKEN}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 10s
      timeout: 10s
      retries: 30
    restart: unless-stopped
  init:
    image: autodev-api:local
    build: {context: ., dockerfile: infra/Dockerfile.api}
    environment: *app-env
    command: [sh, -ec, 'pnpm --filter @autodev/api migrate && pnpm --filter @autodev/api seed']
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  api:
    image: autodev-api:local
    build: {context: ., dockerfile: infra/Dockerfile.api}
    environment:
      <<: *app-env
      PORT: '4000'
    volumes: [workspaces:/workspaces:ro, integration:/integration:ro]
    ports: ['127.0.0.1:4000:4000']
    depends_on:
      init: {condition: service_completed_successfully}
      runner: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
      gitea: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://localhost:4000/api/v1/health").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  worker:
    image: autodev-api:local
    build: {context: ., dockerfile: infra/Dockerfile.api}
    environment: *app-env
    command: [pnpm, --filter, '@autodev/api', worker]
    volumes: [integration:/integration:ro]
    depends_on:
      init: {condition: service_completed_successfully}
      runner: {condition: service_healthy}
      gitea: {condition: service_healthy}
    restart: unless-stopped
  live:
    image: node:22-bookworm-slim
    user: node
    command: [node, /gateway/live-gateway.mjs]
    environment:
      RUNNER_URL: http://runner:4100
      RUNNER_TOKEN: ${RUNNER_TOKEN:-local-only-runner-token-change-before-production-2026}
    volumes: ['./infra/live-gateway.mjs:/gateway/live-gateway.mjs:ro']
    ports: ['127.0.0.1:4400:4400']
    depends_on:
      runner: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://localhost:4400/health").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  dashboard:
    build:
      context: .
      dockerfile: infra/Dockerfile.dashboard
      args: {API_URL: 'http://api:4000'}
    environment:
      API_URL: http://api:4000
      NEXT_TELEMETRY_DISABLED: '1'
    ports: ['127.0.0.1:3000:3000']
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://localhost:3000").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped
volumes:
  postgres-data:
  redis-data:
  minio-data:
  gitea-data:
  workspaces: {name: autodev-workspaces}
  runner-state:
  integration:
