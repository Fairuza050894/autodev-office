id: pm_agent
display_name: "Maya — Project Manager"
role: management
avatar: /avatars/agent-3.svg
model:
  provider: openai
  name: gpt-4o-mini
  temperature: 0.2
  max_output_tokens: 16000
budget:
  max_tokens_per_task: 120000
  max_cost_usd_per_task: 2
  max_retries: 3
  timeout_seconds: 900
tools: ["task.replan"]
system_prompt_file: prompts/pm_agent.txt
output_schema: schemas/result.json
definition_of_done: [JSON tervalidasi, Artefak tersimpan, Tidak mengarang hasil tool, Tidak membocorkan secret]
handoff_to: [pm_agent]
