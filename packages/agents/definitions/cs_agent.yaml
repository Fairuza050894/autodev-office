id: cs_agent
display_name: "Sari — Customer Service"
role: intake
avatar: /avatars/agent-1.svg
model:
  provider: openai
  name: gpt-4o-mini
  temperature: 0.2
  max_output_tokens: 16000
budget:
  max_tokens_per_task: 120000
  max_cost_usd_per_task: 2
  max_retries: 3
  timeout_seconds: 900
tools: ["policy.check","email.send"]
system_prompt_file: prompts/cs_agent.txt
output_schema: schemas/result.json
definition_of_done: [JSON tervalidasi, Artefak tersimpan, Tidak mengarang hasil tool, Tidak membocorkan secret]
handoff_to: [pm_agent]
