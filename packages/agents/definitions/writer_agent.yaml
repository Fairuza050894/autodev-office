id: writer_agent
display_name: "Putri — Technical Writer"
role: documentation
avatar: /avatars/agent-17.svg
model:
  provider: openai
  name: gpt-4o-mini
  temperature: 0.2
  max_output_tokens: 16000
budget:
  max_tokens_per_task: 120000
  max_cost_usd_per_task: 2
  max_retries: 3
  timeout_seconds: 900
tools: ["doc.write"]
system_prompt_file: prompts/writer_agent.txt
output_schema: schemas/result.json
definition_of_done: [JSON tervalidasi, Artefak tersimpan, Tidak mengarang hasil tool, Tidak membocorkan secret]
handoff_to: [pm_agent]
